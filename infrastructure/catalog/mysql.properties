# catalog/mysql.properties
# Trino đọc file này thành catalog tên mysql.
# mysql: hostname của service MySQL trên network bi-network, cổng 3306 trong container.
# Trên máy host, MySQL publish ở cổng 13306.
# bi_agent chỉ có SELECT và SHOW VIEW trên agentic_bi (xem docker/mysql/init/01_schema.sql).

connector.name=mysql
connection-url=jdbc:mysql://mysql:3306?useUnicode=true&characterEncoding=UTF-8
connection-user=bi_agent
connection-password=bi_agent_pass

# Dữ liệu được seed từ ./docker/mysql/init/01_init_mysql.sql.
# Cách dùng sau khi docker compose up -d:
#   SHOW SCHEMAS FROM mysql;
#   SHOW TABLES FROM mysql.agentic_bi;
#   SELECT * FROM mysql.agentic_bi.customer_profiles;
