# catalog/pg.properties
# connector.name=postgresql: Khai báo loại connector (trình kết nối) mà Trino sẽ sử dụng. Ở đây là postgresql, báo cho Trino biết cần dùng driver tương ứng để nói chuyện với DB PostgreSQL.
# Chuỗi kết nối JDBC. Trong đó:
    # jdbc:postgresql://: Giao thức kết nối.
    # postgres-db: Tên host. Do chạy cùng mạng Docker, Trino có thể phân giải tên service postgres-db thành IP của container chứa PostgreSQL.
    # 5432: Cổng mặc định của PostgreSQL.
    # analytics_db: Tên cơ sở dữ liệu sẽ kết nối.
    # connection-user=bi_user: Tên người dùng (user) để đăng nhập vào cơ sở dữ liệu PostgreSQL.
    # connection-password=securepassword: Mật khẩu của người dùng bi_user.

connector.name=postgresql
connection-url=jdbc:postgresql://postgres-db:5432/analytics_db
connection-user=bi_user
connection-password=securepassword

# Cách sử dụng:
#   docker compose up -d
# Sau khi Trino khởi động, catalog này có tên pg và có thể truy vấn:
#   SHOW TABLES FROM pg.public;
#   SELECT * FROM pg.public.orders;
